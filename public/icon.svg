<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Clip path for smooth iOS squircle -->
    <clipPath id="squircleClip">
      <rect width="512" height="512" rx="112" ry="112" />
    </clipPath>
    <!-- Gradient backgrounds -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#020203" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <!-- Base Icon Shape with Clip -->
  <g clip-path="url(#squircleClip)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bgGrad)" />

    <!-- Top Egyptian Flag Stripe Accent -->
    <rect x="0" y="0" width="512" height="20" fill="#e11d48" />
    <rect x="0" y="20" width="512" height="20" fill="#ffffff" />
    <rect x="0" y="40" width="512" height="20" fill="#09090b" />

    <!-- Outer Decorative Glow Ring -->
    <circle cx="256" cy="266" r="170" fill="none" stroke="#e11d48" stroke-width="3" opacity="0.25" stroke-dasharray="12 8" />

    <!-- Egyptian License Plate Container Motif -->
    <rect x="96" y="126" width="320" height="280" rx="36" fill="url(#plateGrad)" stroke="#cbd5e1" stroke-width="8" />
    
    <!-- License Plate Header Bar (Egyptian Style Red Top) -->
    <path d="M 96 162 C 96 142.1 112.1 126 132 126 L 380 126 C 399.9 126 416 142.1 416 162 L 416 200 L 96 200 Z" fill="url(#redGrad)" />
    
    <!-- Header Text "مـصـر / EGYPT" -->
    <text x="256" y="174" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="30" text-anchor="middle" letter-spacing="4">مـصـر</text>

    <!-- Center Main Brand Symbol: Bold stylized "RQ" -->
    <text x="256" y="325" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="110" text-anchor="middle" letter-spacing="12">RQ</text>

    <!-- Plate Bottom Divider Line -->
    <line x1="120" y1="365" x2="392" y2="365" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

    <!-- Subtitle / Car Badge Motif -->
    <text x="256" y="392" fill="#64748b" font-family="system-ui, sans-serif" font-weight="800" font-size="18" text-anchor="middle" letter-spacing="6">GARAGE SYSTEM</text>
  </g>

  <!-- Border Highlight for iOS squircle -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.15" />
</svg>
