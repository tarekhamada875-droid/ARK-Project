<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark elegant background with rounded squircle -->
  <rect width="512" height="512" fill="url(#bgGrad)" rx="112" />
  
  <!-- Subtle inner border highlight -->
  <rect x="2" y="2" width="508" height="508" fill="none" stroke="#27272a" stroke-width="4" rx="110" />

  <!-- Outer Garage/Gate Shield Arch -->
  <path d="M 128 350 L 128 200 C 128 130 384 130 384 200 L 384 350" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Sleek Modern Car Silhouette (Front View) -->
  <!-- Car Roof & Windshield -->
  <path d="M 192 230 C 205 190 307 190 320 230 Z" fill="url(#carGrad)" opacity="0.9" />
  
  <!-- Car Body Main Structure -->
  <path d="M 152 250 C 152 235 170 230 190 230 L 322 230 C 342 230 360 235 360 250 L 368 290 C 370 305 360 320 344 320 L 168 320 C 152 320 142 305 144 290 Z" fill="url(#carGrad)" />
  
  <!-- LED Headlights (Left & Right) -->
  <polygon points="168,262 210,265 204,275 168,272" fill="#34d399" />
  <polygon points="344,262 302,265 308,275 344,272" fill="#34d399" />

  <!-- Front Grille & Air Intake -->
  <rect x="220" y="280" width="72" height="22" rx="6" fill="#000000" stroke="#34d399" stroke-width="3" />
  
  <!-- Center Accent Bar (Garage Barrier Accent) -->
  <rect x="232" y="288" width="48" height="6" rx="3" fill="url(#emeraldGrad)" />

  <!-- Wheels (Front Left & Right Tires Visible) -->
  <rect x="150" y="318" width="36" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="3" />
  <rect x="326" y="318" width="36" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="3" />

  <!-- Ground / Entry Glow Line -->
  <rect x="136" y="376" width="240" height="10" rx="5" fill="url(#emeraldGrad)" />
</svg>
