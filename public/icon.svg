<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Squircle clip path for smooth app icon rounded corners -->
    <clipPath id="iconClip">
      <rect width="512" height="512" rx="112" ry="112" />
    </clipPath>
  </defs>

  <!-- Clipped Container -->
  <g clip-path="url(#iconClip)">
    <!-- Left Half: Deep Black -->
    <rect x="0" y="0" width="256" height="512" fill="#0a0a0c" />
    
    <!-- Right Half: Vibrant Red -->
    <rect x="256" y="0" width="256" height="512" fill="#ce1126" />
    
    <!-- Center Thin White Divider Line -->
    <line x1="256" y1="0" x2="256" y2="512" stroke="#ffffff" stroke-width="6" />
  </g>

  <!-- Subtle Rim Highlight -->
  <rect x="2" y="2" width="508" height="508" fill="none" stroke="#27272a" stroke-width="4" rx="110" opacity="0.4" />
</svg>
